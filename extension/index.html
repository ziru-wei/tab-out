<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pocket-coin-hidden pocket-position-left pocket-layout-pending">
<div class="ambient-rain-layer" id="ambientRainLayer" aria-hidden="true">
  <canvas id="ambientRainCanvas"></canvas>
</div>
<header class="dashboard-top">
  <p class="daily-quote" id="dailyQuote" hidden></p>
  <button class="tabout-coin" id="taboutMetalCoin" type="button" aria-label="Pocket hidden; click to show Pocket" aria-pressed="false">
    <span class="tabout-coin__shadow" aria-hidden="true"></span>
    <span class="tabout-coin__contact-shadow" aria-hidden="true"></span>
    <span class="tabout-coin__inner">
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__edge" aria-hidden="true"></span>
      <span class="tabout-coin__face tabout-coin__face--front">
        <span class="tabout-coin__clip"><canvas id="taboutCoinFront"></canvas></span>
      </span>
      <span class="tabout-coin__face tabout-coin__face--back">
        <span class="tabout-coin__clip"><canvas id="taboutCoinBack"></canvas></span>
      </span>
    </span>
  </button>

  <div class="keyboard-prompts" aria-label="Keyboard shortcuts">
    <p id="selectionKeyboardPrompt" hidden></p>
    <p class="candidate-keyboard-prompt" id="candidateKeyboardPrompt" aria-live="polite" hidden></p>
    <p id="archiveLooseTabsKeyboardPrompt" hidden></p>
    <p id="undoKeyboardPrompt" hidden></p>
  </div>
</header>

<div class="container">

  <section class="ambience-mixer" data-ambience-mixer aria-label="Ambience mixer">
    <div class="ambience-mixer__pad" data-ambience-pad>
      <span class="ambience-mixer__axis ambience-mixer__axis--top">LOUDER</span>
      <span class="ambience-mixer__axis ambience-mixer__axis--bottom">QUIET</span>
      <span class="ambience-mixer__axis ambience-mixer__axis--left">DRY</span>
      <span class="ambience-mixer__axis ambience-mixer__axis--right">ROOMY</span>
      <div class="ambience-mixer__point" data-track="rain">
        <div class="ambience-mixer__point-core"></div>
        <span class="ambience-mixer__point-label">Rain</span>
      </div>
      <div class="ambience-mixer__point" data-track="chat">
        <div class="ambience-mixer__point-core"></div>
        <span class="ambience-mixer__point-label">Cafe</span>
      </div>
      <div class="ambience-mixer__point" data-track="lofi">
        <div class="ambience-mixer__point-core"></div>
        <span class="ambience-mixer__point-label">Lofi</span>
      </div>
    </div>
    <div class="ambience-mixer__values">
      <div class="ambience-mixer__value" data-readout="rain"><strong>&lt;Rain&gt; /</strong><span></span></div>
      <div class="ambience-mixer__value" data-readout="chat"><strong>&lt;Cafe&gt; /</strong><span></span></div>
      <div class="ambience-mixer__value" data-readout="lofi"><strong>&lt;Lofi&gt; /</strong><span></span></div>
    </div>
  </section>

  <div class="active-section" id="openTabsSection">
    <div class="missions" id="openTabsMissions"></div>
  </div>

  <section class="archive-section" id="archiveSection">
    <div class="archive-dropzone" id="archiveDropZone">
      <div class="archive-empty" id="archiveEmpty" hidden></div>
      <div class="archive-tabs missions" id="archiveTabs"></div>
    </div>
    <div class="archive-controls">
      <button class="action-btn icon-button" id="cyclePocketPositionButton" data-action="cycle-pocket-position" data-pocket-tooltip="Move Pocket" aria-label="Move Pocket">
        <span class="button-icon icon-layout-freeform" aria-hidden="true"></span>
      </button>
      <button class="action-btn icon-button" id="killArchiveButton" data-action="kill-archive-live" data-pocket-tooltip="Kill live Pocket tabs" aria-label="Kill every live tab in Pocket" disabled>
        <span class="button-icon icon-kill" aria-hidden="true"></span>
      </button>
      <button class="action-btn danger icon-button" id="clearArchiveButton" data-action="clear-archive" data-pocket-tooltip="Clean Pocket" aria-label="Remove every item from Pocket" disabled>
        <span class="button-icon icon-close" aria-hidden="true"></span>
      </button>
      <button class="action-btn icon-button" id="restoreArchiveButton" data-action="restore-archive" data-pocket-tooltip="Take everything out" aria-label="Restore every tab from Pocket" disabled>
        <span class="button-icon icon-restore" aria-hidden="true"></span>
      </button>
    </div>
  </section>

</div><!-- end .container -->

<!-- ================================================================
     TOAST — floats above everything, used for action confirmations
     Hidden by default via CSS (opacity:0, translateY)
     ================================================================ -->
<div class="toast" id="toast">
  <!-- Checkmark circle icon (Heroicons outline) -->
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<!-- Main dashboard logic — loads last so the DOM is ready -->
<script src="contracts.js"></script>
<script src="diagnostics.js"></script>
<script src="ambient-tracks.js"></script>
<script src="vendor/sparkle-rain.js"></script>
<script src="ambient-rain.js"></script>
<script src="ambient-mixer.js"></script>
<script src="ui-audio.js"></script>
<script src="metal-coin.js"></script>
<script src="error-semantics.js"></script>
<script src="pocket-identity.js"></script>
<script src="captain-rules.js"></script>
<script src="vendor/tldts.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
